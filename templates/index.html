<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wirtualny Nauczyciel - Strona Główna</title>
    <!-- Pobranie nowoczesnej czcionki Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon {
            font-size: 60px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        p.subtitle {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #34495e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select {
            width: 100%;
            padding: 12px 15px;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            border: 2px solid #e0e6ed;
            border-radius: 10px;
            outline: none;
            background-color: #f8fafc;
            transition: border-color 0.3s;
            cursor: pointer;
            appearance: none;
            /* Własna strzałka dla selecta */
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23333%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 15px top 50%;
            background-size: 12px auto;
        }

        select:focus {
            border-color: #74ebd5;
        }

        .btn-start {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Poppins', sans-serif;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
        }

        .btn-start:active {
            transform: translateY(0);
        }

        .empty-state {
            color: #e74c3c;
            font-size: 14px;
            margin-bottom: 20px;
            background-color: #fdecep;
            padding: 10px;
            border-radius: 8px;
        }

        .settings-link {
            display: inline-block;
            margin-top: 25px;
            font-size: 14px;
            color: #95a5a6;
            text-decoration: none;
            transition: color 0.3s;
        }

        .settings-link:hover {
            color: #34495e;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🎓🤖</div>
        <h1>Virtual Teacher</h1>
        <p class="subtitle">Choose a topic and start an interactive lesson with the AI assistant.</p>

        {% if agents %}
            <div class="form-group">
                <label for="agent-select">Select a teacher:</label>
                <select id="agent-select">
                    {% for agent in agents %}
                        <option value="{{ agent.id }}">{{ agent.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <button class="btn-start" onclick="startLesson()">Start the lesson 🚀</button>
        {% else %}
            <div class="empty-state">
                Brak skonfigurowanych agentów. Przejdź do ustawień, aby dodać swojego pierwszego nauczyciela.
            </div>
        {% endif %}

        <a href="/settings" class="settings-link">⚙️ Go to settings</a>
    </div>

    <script>
        function startLesson() {
            const select = document.getElementById('agent-select');
            if (select && select.value) {
                // Przekierowanie do widoku lekcji z wybranym ID agenta
                window.location.href = '/lesson/' + select.value;
            }
        }
    </script>

</body>
</html>
